# 人身损害赔偿计算器示例配置
# 当前代码通过 CompensationCalculator(config={...}) 接收配置，本文件不会自动加载。
# 所有金额都必须替换为案件适用地区、适用年度的官方数据或经律师确认的标准。

# 赔偿标准配置
compensation_standards:
  # 住院伙食补助费（元/天）
  hospital_meal_subsidy: 100

  # 营养费（元/天）
  nutrition_fee: 50

  # 交通费（元/天）
  transportation_fee: 20

  # 护理费标准（元/天）
  nursing_fee:
    普通: 150
    一级: 225
    特级: 300

# 收入标准（年）
income_standards:
  # 上一年度城镇居民人均可支配收入（元）
  urban_disposable_income: 50000

  # 上一年度城镇居民人均消费支出（元）
  urban_consumption_expenditure: 30000

  # “上一年度”通常指一审法庭辩论终结时的上一统计年度
  statistical_year: null
  source_url: null

# 伤残等级系数（1-10级）
disability_coefficients:
  1: 1.0
  2: 0.9
  3: 0.8
  4: 0.7
  5: 0.6
  6: 0.5
  7: 0.4
  8: 0.3
  9: 0.2
  10: 0.1

# 精神损害抚慰金没有全国统一固定档位，默认不自动计入
mental_distress_compensation:
  auto_include: false
  note: "按侵权过错、行为情节、损害后果、责任能力和当地生活水平等个案复核"

# 计算参数
calculation_parameters:
  # 残疾赔偿金计算年限
  disability_compensation_years:
    60岁以下: 20
    60-75岁: "20-(年龄-60)"
    75岁以上: 5

  # 被扶养人生活费计算年限
  dependent_support_years:
    未成年人: "18-年龄"
    成年人: "仅在无劳动能力且无其他生活来源时计算20年"
    60-75岁: "20-(年龄-60)"
    75岁以上: 5
  multiple_dependents_annual_cap: "完整的上一年度城镇居民人均消费支出额（不乘伤残系数）"
